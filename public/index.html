<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bons Lugares</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">Bons Lugares</a>
    <div id="account"></div>
  </header>

  <main>
    <section class="intro">
      <h1>Encontre seu próximo lugar favorito.</h1>
      <input id="search" type="search" placeholder="Buscar estabelecimento">
    </section>

    <p id="message" hidden></p>

    <section id="auth" class="box" hidden>
      <div class="section-title">
        <h2 id="auth-title">Entrar</h2>
        <button id="close-auth" class="plain" type="button">Fechar</button>
      </div>
      <form id="login-form" class="form">
        <label>E-mail<input name="email" type="email" required></label>
        <label>Senha<input name="password" type="password" required></label>
        <button class="button" type="submit">Entrar</button>
        <button class="plain" type="button" data-mode="register">Criar conta</button>
      </form>
      <form id="register-form" class="form" hidden>
        <label>Nome<input name="name" required></label>
        <label>E-mail<input name="email" type="email" required></label>
        <label>Senha<input name="password" type="password" minlength="8" required></label>
        <label>Tipo
          <select name="tipo">
            <option value="2">Cliente</option>
            <option value="3">Estabelecimento</option>
          </select>
        </label>
        <button class="button" type="submit">Cadastrar</button>
        <button class="plain" type="button" data-mode="login">Já tenho conta</button>
      </form>
    </section>

    <section id="business" class="box" hidden>
      <h2>Cadastrar estabelecimento</h2>
      <form id="business-form" class="form">
        <label>Nome<input name="name" required></label>
        <label>CNPJ<input name="CNPJ" required></label>
        <label>Descrição<input name="descricao" required></label>
        <label>Telefone<input name="phone" required></label>
        <label>Horário<input name="horario" required></label>
        <button class="button" type="submit">Cadastrar local</button>
      </form>
    </section>

    <section id="moderation" class="box" hidden>
      <h2>Avaliações para aprovar</h2>
      <div id="pending"></div>
    </section>

    <section>
      <h2>Estabelecimentos</h2>
      <div id="places">Carregando...</div>
    </section>
  </main>
</body>
</html>
